<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Office QR Display</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="bg-gray-900 flex flex-col items-center justify-center min-h-screen p-4 text-white">
    <div class="text-center mb-8">
        <h1 class="text-6xl font-black mb-4 text-blue-400">Intern Attendance</h1>
        <p class="text-2xl text-gray-400 font-semibold">Scan this QR code with your phone to Clock-In/Out.</p>
    </div>

    <div class="bg-white p-8 rounded-3xl shadow-2xl border-8 border-gray-800">
        <div id="qrcode" class="mx-auto flex justify-center"></div>
    </div>
    
    <div class="mt-8 text-center text-gray-500 font-bold">
        <p class="text-lg text-gray-400">Please connect to the office Wi-Fi before scanning.</p>
    </div>

    <script>
        const scanUrl = window.location.origin + '/scan';
        new QRCode(document.getElementById("qrcode"), {
            text: scanUrl,
            width: 400,
            height: 400,
            colorDark : "#0f172a",
            colorLight : "#ffffff",
            correctLevel : QRCode.CorrectLevel.H
        });
    </script>
</body>
</html>
