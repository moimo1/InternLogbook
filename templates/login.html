<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Office Attendance - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">
    <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-sm">
        <h2 class="text-2xl font-bold mb-6 text-center text-gray-800">Intern Sign In</h2>
        <form method="POST">
            <div class="mb-4">
                <label class="block text-gray-700 font-semibold mb-2">Username</label>
                <input type="text" name="username" required class="w-full px-3 py-2 border rounded-md focus:outline-none">
            </div>
            <div class="mb-6">
                <label class="block text-gray-700 font-semibold mb-2">Password</label>
                <input type="password" name="password" required class="w-full px-3 py-2 border rounded-md focus:outline-none">
            </div>
            <button type="submit" class="w-full bg-blue-600 text-white font-bold py-2 rounded-md hover:bg-blue-700">Log In</button>
        </form>
    </div>
    <script>
        document.addEventListener('submit', function(e) {
            const form = e.target;
            const submitBtn = e.submitter || form.querySelector('button[type="submit"]');
            if (submitBtn && !submitBtn.disabled) {
                // Determine if we should preserve the original size
                const btnWidth = submitBtn.offsetWidth;
                if (btnWidth) {
                    submitBtn.style.width = btnWidth + 'px';
                }
                
                submitBtn.disabled = true;
                submitBtn.classList.add('opacity-75', 'cursor-not-allowed', 'flex', 'items-center', 'justify-center');
                
                // Keep the icon if it exists, otherwise just a spinner
                submitBtn.innerHTML = `
                    <svg class="animate-spin -ml-1 mr-2 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    Logging in...
                `;
            }
        });
    </script>
</body>
</html>
